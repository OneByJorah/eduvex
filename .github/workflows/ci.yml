name: ci
run-name: "${{ github.workflow }} by @${{ github.actor }}"

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/reusable-ci.yml
    with:
      compose-file: docker-compose.yml
