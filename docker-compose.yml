services:
  ollama:
    image: ollama/ollama:latest
    container_name: training-ollama
    expose:
      - "11434"
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3

  qdrant:
    image: qdrant/qdrant:latest
    container_name: training-qdrant
    expose:
      - "6333"
    volumes:
      - qdrant:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      # The qdrant image (debian-slim) ships no curl — probe the port via bash /dev/tcp.
      test: ["CMD-SHELL", "bash -c ':<>/dev/tcp/127.0.0.1/6333'"]
      interval: 30s
      timeout: 10s
      retries: 3

  minio:
    # Official MinIO images (quay.io/minio/minio, minio/minio) were pulled and now
    # require registry auth — anonymous pulls fail with "unauthorized". Use the
    # pinned community snapshot from the Bitnami legacy mirror (anonymous pull OK).
    image: bitnamilegacy/minio:2025.4.22
    container_name: training-minio
    command: server /bitnami/minio/data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio:/bitnami/minio/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3

  training-api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: training-api
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID}
    volumes:
      - ./api:/app
      - uploads:/uploads
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  ollama:
  qdrant:
  minio:
  uploads:
